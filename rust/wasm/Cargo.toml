[package]
name = "opencut-wasm"
version = "0.2.10"
edition = "2024"
description = "Shared video editor logic compiled to WebAssembly"
repository = "https://github.com/opencut/opencut"
license = "MIT"

[lib]
path = "src/wasm.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
bridge = { version = "0.1.0", path = "../crates/bridge" }
comparison = { version = "0.1.0", path = "../crates/comparison", features = ["wasm"] }
compositor = { version = "0.1.0", path = "../crates/compositor" }
console_error_panic_hook = "0.1.7"
effects = { version = "0.1.0", path = "../crates/effects" }
edit-plan = { version = "0.1.0", path = "../crates/edit-plan", features = ["wasm"] }
gpu = { version = "0.1.0", path = "../crates/gpu", features = ["wasm"] }
js-sys = "0.3.93"
masks = { version = "0.1.0", path = "../crates/masks" }
media-foundation = { version = "0.1.0", path = "../crates/media-foundation", features = ["wasm"] }
num-traits = "0.2.19"
project-state = { version = "0.1.0", path = "../crates/project-state", features = ["wasm"] }
review-evidence = { version = "0.1.0", path = "../crates/review-evidence", features = ["wasm"] }
serde = { version = "1.0.228", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
time = { version = "0.1.0", path = "../crates/time", features = ["wasm"] }
wasm-bindgen = "0.2.116"
wasm-bindgen-futures = "0.4.66"
web-sys = { version = "0.3.93", features = ["OffscreenCanvas", "HtmlCanvasElement", "CanvasRenderingContext2d", "Document", "Window", "Performance"] }

[dev-dependencies]
serde_json = "1.0.145"
tsify-next = { version = "0.5", default-features = false, features = ["js"] }
wasm-bindgen-test = "0.3.66"

[features]
default = ["wasm"]
wasm = []

[package.metadata.wasm-pack.profile.profiling]
# The test runtime is only ever executed by Bun, so the optimizer pass buys
# nothing here and costs more than every test it enables. Codegen still uses
# the release profile, so behaviour matches the shipped package.
wasm-opt = false
