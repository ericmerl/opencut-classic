[package]
name = "media-foundation"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
path = "src/media_foundation.rs"

[dependencies]
bridge = { version = "0.1.0", path = "../bridge" }
canonical-json = { version = "0.1.0", path = "../canonical-json" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tsify-next = { version = "0.5", optional = true }
wasm-bindgen = { version = "0.2.116", optional = true }

[features]
wasm = ["dep:wasm-bindgen", "dep:tsify-next", "tsify-next/js"]
