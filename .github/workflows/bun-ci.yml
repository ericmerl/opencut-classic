name: Bun CI

concurrency:
  group: bun-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [main, "codex/**"]
    paths-ignore:
      - "*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "*.md"

env:
  DATABASE_URL: "postgresql://opencut:opencut@localhost:5432/opencut"
  BETTER_AUTH_SECRET: "ci-only-not-a-production-secret-1234567890"
  NEXT_PUBLIC_SITE_URL: "http://localhost:3000"
  UPSTASH_REDIS_REST_URL: "https://your-upstash-redis-url"
  UPSTASH_REDIS_REST_TOKEN: "your-upstash-redis-token"
  NEXT_PUBLIC_MARBLE_API_URL: "https://placeholder.example.com"
  MARBLE_WORKSPACE_KEY: "placeholder"
  FREESOUND_CLIENT_ID: "placeholder"
  FREESOUND_API_KEY: "placeholder"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    env:
      OPENCUT_TEST_MCP_WORKERS: "1"
      OPENCUT_TEST_WEB_WORKERS: "4"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf # v2.85.5
        with:
          tool: wasm-pack@0.15.0
          fallback: none

      - name: Install desktop build dependencies on Linux
        if: runner.os == 'Linux'
        run: bash apps/desktop/script/setup

      - name: Verify desktop build dependencies on macOS
        if: runner.os == 'macOS'
        run: bash apps/desktop/script/setup

      - name: Verify desktop build dependencies on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./apps/desktop/script/setup.ps1

      - name: Install FFmpeg on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get install -y ffmpeg

      - name: Install FFmpeg on macOS
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install FFmpeg on Windows
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y

      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            rust/wasm/pkg-node
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('Cargo.lock') }}

      - name: Install Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: 1.2.18

      - name: Cache Bun modules
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.2.18-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify test prerequisites
        run: |
          rustc --version
          cargo --version
          wasm-pack --version
          bun --version
          ffmpeg -version
          ffprobe -version

      - name: Run tests
        run: bun run test

  build-web:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf # v2.85.5
        with:
          tool: wasm-pack@0.15.0
          fallback: none

      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('Cargo.lock') }}

      - name: Install Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: 1.2.18

      - name: Cache Bun modules
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.2.18-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify build prerequisites
        run: |
          rustc --version
          cargo --version
          wasm-pack --version
          bun --version

      - name: Build
        run: bun run build:web
